services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lms-app

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/lms

    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      - lms_videos:/app/storage/videos

    networks:
      - lms-network


  mongo:
    image: mongo:8

    container_name: lms-mongodb

    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - lms-network


volumes:
  mongo_data:
  lms_videos:


networks:
  lms-network:
    driver: bridge